[project]
name = "badgerdrop"
version = "0.1.1"
description = "AppImage installer for Linux"
requires-python = ">=3.11"
dependencies = [
    "pygobject>=3.46.0",
    "pydantic>=2.0.0",
    "pygobject-stubs>=2.16.0"
]

[project.scripts]
badgerdrop = "badgerdrop:main"
badgerdrop-debug = "badgerdrop:debug_main"
badgerdrop-list = "badgerdrop:list_main"
badgerdrop-sound = "badgerdrop:sound_toggle_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/badgerdrop"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "deadcode>=2.4.1",
]

[tool.ruff]
lint.select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",  # Enable import sorting
]
line-length = 88
target-version = "py313"

# Enable Ruff formatting (replaces Black and isort)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
